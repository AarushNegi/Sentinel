<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel — Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .dashboard-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px;
    }

    .welcome-badge {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 99px;
      padding: 6px 18px;
      font-size: 13px;
      color: #22c55e;
      margin-bottom: 8px;
    }

    .dashboard-title {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .dashboard-sub {
      font-size: 15px;
      color: #6b7280;
      max-width: 400px;
      line-height: 1.7;
    }

    .user-info {
      background: #111118;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px 32px;
      margin-top: 8px;
      font-size: 14px;
      color: #9ca3af;
    }

    .user-info span {
      color: #3b82f6;
      font-weight: 600;
    }

    .logout-btn {
      margin-top: 16px;
      background: transparent;
      border: 1px solid rgba(239,68,68,0.4);
      color: #ef4444;
      border-radius: 10px;
      padding: 10px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: rgba(239,68,68,0.08);
    }
  </style>
</head>
<body>
  <div class="sim-notice">
    <span class="sim-dot"></span>
    This is a simulation environment.
  </div>

  <div class="dashboard-wrapper">
    <div class="welcome-badge">✅ Logged In Successfully</div>
    <h1 class="dashboard-title">Welcome to <span class="the">Sentinel</span></h1>
    <p class="dashboard-sub">Your cybersecurity training dashboard is being built. Stay tuned!</p>

    <div class="user-info">
      Logged in as: <span id="userName">Loading...</span> &nbsp;|&nbsp; Role: <span id="userRole">Loading...</span>
    </div>

    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>

  <script>
    // Load user from localStorage
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) {
      window.location.href = '/';
    } else {
      document.getElementById('userName').textContent = user.name || user.email;
      document.getElementById('userRole').textContent = user.role;
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/';
    }
  </script>
</body>
</html>
